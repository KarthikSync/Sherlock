[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock"
version = "0.1.0"
description = "Stateful detective CLI that turns telemetry failures into durable cases"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
sherlock = "sherlock.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sherlock*"]
